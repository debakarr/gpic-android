syntax = "proto3";
package gphotos;
option java_package = "gphotos";
option java_outer_classname = "CommitUploadResponseOuterClass";

message CommitUploadResponse {
  message Field1Type {
    message InnerField1Type {
      int64 field1 = 1;
      bytes field2 = 2;
    }
    InnerField1Type field1 = 1;
    int64 field2 = 2;
    message Field3Type {
      string media_key = 1;
    }
    Field3Type field3 = 3;
    message Field5Type {
      int64 field1 = 1;
    }
    Field5Type field5 = 5;
  }
  Field1Type field1 = 1;
}
